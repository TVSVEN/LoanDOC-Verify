<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1630">
  <meta name="description" content="LoanDocVerify — transparent, evidence-based loan document verification for applicants and loan officers.">
  <title>LoanDocVerify | Document review workspace</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <section id="auth-screen" class="auth-screen" hidden aria-live="polite"></section>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <button class="brand" data-action="navigate" data-view="overview" aria-label="LoanDocVerify home"><span class="brand-mark">L</span><span class="brand-name">LoanDoc<span>Verify</span><small>DOCUMENT REVIEW</small></span></button>
    <nav id="nav" aria-label="Primary"><div class="nav-section">Loading navigation</div></nav>
    <div class="side-bottom"><div class="privacy-card"><span>◆</span><div><strong>Account privacy</strong><small>Only applications associated with your account are shown.</small></div></div><div class="user-card"><div class="avatar">LD</div><div><strong>Demo workspace</strong><small id="role-label">Loan officer</small></div><span class="demo-badge">LOCAL</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
      <div class="breadcrumbs"><span>LoanDocVerify</span><b>/</b><strong id="crumb">Overview</strong></div>
      <div class="top-actions"><span class="environment-pill"><i></i> Secure workspace</span><span class="environment-pill account-role" id="account-role">Applicant account</span><div class="notification-wrap"><button class="icon-btn notification-button" id="notification-button" aria-label="Notifications" title="Notifications">♧<i class="notification-dot"></i></button><section id="notification-panel" class="notification-panel" hidden></section></div><div class="avatar top-avatar" aria-label="Signed-in profile">LD</div><button class="icon-btn signout-btn" data-action="signout" title="Sign out">Sign out</button></div>
    </header>
    <div class="content" id="content" aria-live="polite"><div class="loading-page">Loading your workspace…</div></div>
  </main>
  <div id="dialog" class="dialog-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>

services:
  loandocverify:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DATA_DIR: /var/data
    ports:
      - "${LDV_BIND_ADDRESS:-127.0.0.1}:${LDV_PORT:-8000}:8000"
    volumes:
      - loandocverify-data:/var/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  loandocverify-data:
